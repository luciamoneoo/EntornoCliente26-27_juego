<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/juego.js"></script>
</head>
<body>

//primero hacmos lo que será el perfil del jugador

 <div id="perfil">
        <h1>Cazar monedas</h1>
        <p id="ultimoJugador"></p>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">

        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" id="fecha">

        <button id="btnEntrar">Entrar</button>
        <p id="mensaje"></p>
    </div>

//continuamos ahora con el panel del juego

    <div id="panel" class="oculto">
        <h2 id="tituloPanel"></h2>
        <p id="datoEdad"></p>

        <p>Puntos: <span id="puntos">0</span> / 50</p>
        <p>Récord: <span id="record">0</span></p>

        <button id="btnAtacar">Atacar</button>
        <button id="btnCofre">Abrir cofre</button>
        <button id="btnMisiones">Ver misiones</button>

        <p id="resultado"></p>
        <p id="misionesHechas"></p>
        <p id="mensajeFinal"></p>
    </div>

</body>
</html>
